<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDD Diamantes - DLS26</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: Arial; padding: 20px; max-width: 500px; margin: auto; }
        h1 { text-align: center; color: #00ff88; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #00ff88; font-weight: bold; }
        input[type="text"], input[type="email"] { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-primary { width: 100%; padding: 15px; background: #00ff88; color: black; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-primary:hover { background: #00dd77; }
        small { color: #aaa; font-size: 12px; }
        input[type="radio"] { margin-right: 8px; }
    </style>
</head>
<body>
    <h1>💎 RDD DIAMANTES DLS26</h1>
    
    <div class="form-group">
        <label for="nome">Nome Completo *</label>
        <input type="text" id="nome" placeholder="Seu nome completo" required>
    </div>

    <div class="form-group">
        <label for="email">Email da conta Google/Apple *</label>
        <input type="email" id="email" placeholder="joao@gmail.com" required>
        <small>É o mesmo email que você usa pra entrar no DLS26</small>
    </div>

    <div class="form-group">
        <label for="numero">Número que pagou M-Pesa/e-Mola *</label>
        <input type="text" id="numero" placeholder="Ex: 841234567" required>
        <small>Pra eu confirmar o pagamento</small>
    </div>

    <div class="form-group">
        <label>Escolha o Pacote *</label>
        <label><input type="radio" name="pacote" value="400 Diamantes - 100MT" required> 400 Diamantes - 100MT</label><br>
        <label><input type="radio" name="pacote" value="1100 Diamantes - 250MT"> 1100 Diamantes - 250MT</label><br>
        <label><input type="radio" name="pacote" value="2200 Diamantes - 450MT"> 2200 Diamantes - 450MT</label>
    </div>

    <p style="color: #00ff88; font-size: 13px; text-align: center;">Depois de enviar, anexe o comprovativo no WhatsApp</p>
    <button class="btn-primary" onclick="enviarWhatsApp()">Enviar Pedido via WhatsApp</button>

<script>
function enviarWhatsApp() {
    let pacote = document.querySelector('input[name="pacote"]:checked');
    let email = document.getElementById('email').value;
    let nome = document.getElementById('nome').value;
    let numero = document.getElementById('numero').value;

    if(!nome || !email || !numero || !pacote) {
        alert("⚠️ Preencha todos os campos obrigatórios *");
        return;
    }

    let mensagem = `*NOVO PEDIDO RDD DIAMANTES* 💎%0A%0A` +
                   `*Pacote:* ${pacote.value}%0A` +
                   `*Email DLS26:* ${email}%0A` +
                   `*Nome:* ${nome}%0A` +
                   `*Número Pagamento:* ${numero}%0A%0A` +
                   `_Por favor anexe o comprovativo de pagamento aqui_`;

    let url = `https://wa.me/258853845605?text=${mensagem}`;
    window.open(url, '_blank');
}
</script>
</body>
          </html>
